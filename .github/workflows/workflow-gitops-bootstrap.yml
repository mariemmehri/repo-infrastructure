name: "GitOps Bootstrap"

on:
  push:
    branches: [main]
    paths:
      - "bootstrap-gitops/**"
      - ".github/workflows/workflow-gitops-bootstrap.yml"

  workflow_dispatch:
    inputs:
      action:
        description: "plan | apply | destroy"
        required: true
        default: "plan"
        type: choice
        options: [plan, apply, destroy]

  workflow_run:
    workflows: ["Terraform Infra"]
    types: [completed]
    branches: [main]

concurrency:
  group: gitops-bootstrap-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  TF_VERSION: "1.7.5"
  TF_BOOTSTRAP_DIR: "bootstrap-gitops"

jobs:
  # ─────────────────────────────────────────────────────────
  # JOB 0 — CHECK TRIGGER
  # ─────────────────────────────────────────────────────────
  check-trigger:
    name: "Check trigger validity"
    runs-on: ubuntu-latest
    outputs:
      should-run: ${{ steps.check.outputs.should-run }}
    steps:
      - name: Evaluate trigger
        id: check
        shell: bash
        run: |
          if [ "${{ github.event_name }}" == "workflow_run" ]; then
            if [ "${{ github.event.workflow_run.conclusion }}" == "success" ]; then
              echo "should-run=true" >> "$GITHUB_OUTPUT"
              echo "Triggered by successful infra run — proceeding."
            else
              echo "should-run=false" >> "$GITHUB_OUTPUT"
              echo "Infra workflow did not succeed — skipping."
            fi
          else
            echo "should-run=true" >> "$GITHUB_OUTPUT"
            echo "Direct trigger — proceeding."
          fi

  # ─────────────────────────────────────────────────────────
  # JOB 1 — PLAN
  # Skippé si action=destroy
  # FIX: on cible uniquement argocd + namespace pour éviter
  # l'erreur "CRD Application not found" au moment du plan.
  # kubernetes_manifest.root_app nécessite le CRD argoproj.io
  # qui n'existe qu'après l'installation d'ArgoCD — on l'exclut
  # du plan ici ; il sera planifié+appliqué à l'étape 4 du Apply.
  # ─────────────────────────────────────────────────────────
  plan:
    name: "Plan — GitOps Bootstrap"
    needs: check-trigger
    runs-on: ubuntu-latest
    if: |
      needs.check-trigger.outputs.should-run == 'true' &&
      (
        github.event_name != 'workflow_dispatch' ||
        inputs.action != 'destroy'
      )

    defaults:
      run:
        working-directory: ${{ env.TF_BOOTSTRAP_DIR }}

    outputs:
      exitcode: ${{ steps.plan.outputs.exitcode }}

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.SERVICE_ACCOUNT_EMAIL }}

      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Verify cluster exists
        run: |
          gcloud container clusters describe \
            ${{ vars.GKE_CLUSTER_NAME }} \
            --region ${{ vars.GCP_REGION }}-b \
            --project ${{ vars.GCP_PROJECT_ID }}

      - name: Get GKE credentials
        run: |
          gcloud container clusters get-credentials \
            ${{ vars.GKE_CLUSTER_NAME }} \
            --region ${{ vars.GCP_REGION }}-b \
            --project ${{ vars.GCP_PROJECT_ID }}

      - name: Write terraform.tfvars
        run: |
          cat > terraform.tfvars <<EOF
          project_id             = "${{ vars.GCP_PROJECT_ID }}"
          region                 = "${{ vars.GCP_REGION }}"
          cluster_name           = "${{ vars.GKE_CLUSTER_NAME }}"
          gitops_repo_url        = "${{ vars.GITOPS_REPO_URL }}"
          gitops_target_revision = "main"
          gitops_path            = "${{ vars.GITOPS_PATH }}"
          EOF

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.GCS_BUCKET_NAME }}" \
            -backend-config="prefix=bootstrap" \
            -reconfigure -input=false -no-color

      # FIX: -target sur argocd + namespace uniquement.
      # kubernetes_manifest.root_app est exclu du plan car son CRD
      # (applications.argoproj.io) n'existe pas encore sur le cluster.
      # Il sera créé après l'apply d'ArgoCD (étape 4 du job Apply).
      - name: Terraform Plan — ArgoCD only
        id: plan
        shell: bash
        run: |
          set +e

          terraform plan \
            -no-color \
            -out=tfplan.binary \
            -detailed-exitcode \
            -input=false \
            -target=helm_release.argocd \
            -target=kubernetes_namespace_v1.argocd
          EXIT=$?

          echo "exitcode=${EXIT}" >> "$GITHUB_OUTPUT"

          case "${EXIT}" in
            0) echo "Bootstrap already applied — nothing to do." ;;
            1) echo "Terraform error." ;;
            2) echo "Bootstrap needed — ArgoCD will be installed." ;;
          esac

          if [ "${EXIT}" -eq 1 ]; then exit 1; fi
          exit 0

      - name: Upload plan artifact
        if: steps.plan.outputs.exitcode == '2'
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-bootstrap
          path: |
            ${{ env.TF_BOOTSTRAP_DIR }}/tfplan.binary
            ${{ env.TF_BOOTSTRAP_DIR }}/terraform.tfvars
          retention-days: 1

  # ─────────────────────────────────────────────────────────
  # JOB 2 — APPLY
  # Skippé si action=destroy ou exitcode=0
  # ─────────────────────────────────────────────────────────
  apply:
    name: "Apply — GitOps Bootstrap"
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: |
      needs.plan.outputs.exitcode == '2' &&
      github.event_name != 'pull_request' &&
      (
        github.event_name != 'workflow_dispatch' ||
        inputs.action == 'apply'
      )

    defaults:
      run:
        working-directory: ${{ env.TF_BOOTSTRAP_DIR }}

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.SERVICE_ACCOUNT_EMAIL }}

      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ vars.GKE_CLUSTER_NAME }}
          location: ${{ vars.GCP_REGION }}-b
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Download plan artifact # tfplan et terraform.tfvars
        uses: actions/download-artifact@v4
        with:
          name: tfplan-bootstrap
          path: ${{ env.TF_BOOTSTRAP_DIR }}

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.GCS_BUCKET_NAME }}" \
            -backend-config="prefix=bootstrap" \
            -reconfigure -input=false -no-color

      # ── ÉTAPE 1 : ArgoCD uniquement ──────────────────────
      - name: Terraform Apply — ArgoCD only
        # Important : on applique d'abord ArgoCD seul, sans root-app,
        # pour éviter les erreurs liées à l'absence de CRDs.
        run: |
          terraform apply \
            -target=helm_release.argocd \
            -auto-approve \
            -no-color

      # ── ÉTAPE 2 : attendre que les CRDs soient prêtes ────
      - name: Wait for ArgoCD CRDs
        # Important : les CRDs doivent être établies avant que Terraform
        # puisse créer l'Application root-app.
        run: |
          echo "Waiting for ArgoCD CRDs..."
          kubectl wait --for=condition=established \
            crd/applications.argoproj.io \
            --timeout=120s
          echo "CRDs ready"

      # ── ÉTAPE 3 : ArgoCD pods prêts ──────────────────────
      - name: Wait for ArgoCD server
        run: |
          kubectl wait --for=condition=Ready pods \
            -l app.kubernetes.io/name=argocd-server \
            -n argocd \
            --timeout=300s
          echo "ArgoCD server ready"

      # ── ÉTAPE 4 : root-app maintenant que CRDs existent ──
      - name: Terraform Apply — root-app
        # Maintenant que ArgoCD est prêt et que les CRDs existent,
        # on applique le reste du plan pour créer l'Application root-app.
        # Note : on relance sans -target pour que Terraform planifie
        # et applique kubernetes_manifest.root_app (exclu du plan initial).
        run: terraform apply -auto-approve -no-color

      - name: Release lock on failure
        # Nettoyage du lock Terraform en cas d'échec pour éviter
        # de bloquer les runs suivants.
        if: failure()
        run: |
          gsutil rm -f \
            gs://${{ vars.GCS_BUCKET_NAME }}/bootstrap/default.tflock \
            2>/dev/null || echo "No lock to remove"

      # ── ÉTAPE 5 : vérifications finales ──────────────────
      - name: Verify root-app created
        run: |
          kubectl get application root-app -n argocd
          echo "root-app live"

      - name: Verify todo-staging synced
        run: |
          kubectl wait --for=jsonpath='{.status.sync.status}'=Synced \
            application/todo-staging \
            -n argocd \
            --timeout=180s
          echo "todo-staging synced"

  # ─────────────────────────────────────────────────────────
  # JOB 3 — DESTROY
  # Manuel uniquement — protégé par GitHub Environment
  # Supprime uniquement l'objet root-app (app-of-apps)
  # NE touche PAS au cluster GKE ni à ArgoCD
  # ─────────────────────────────────────────────────────────
  destroy:
    name: "Destroy — GitOps Bootstrap"
    needs: check-trigger
    runs-on: ubuntu-latest
    if: |
      needs.check-trigger.outputs.should-run == 'true' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.action == 'destroy'
    environment: gitops-destroy

    defaults:
      run:
        working-directory: ${{ env.TF_BOOTSTRAP_DIR }}

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.SERVICE_ACCOUNT_EMAIL }}

      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Verify cluster exists
        run: |
          gcloud container clusters describe \
            ${{ vars.GKE_CLUSTER_NAME }} \
            --region ${{ vars.GCP_REGION }}-b \
            --project ${{ vars.GCP_PROJECT_ID }}

      - name: Get GKE credentials
        run: |
          gcloud container clusters get-credentials \
            ${{ vars.GKE_CLUSTER_NAME }} \
            --region ${{ vars.GCP_REGION }}-b \
            --project ${{ vars.GCP_PROJECT_ID }}

      - name: Write terraform.tfvars
        run: |
          cat > terraform.tfvars <<EOF
          project_id             = "${{ vars.GCP_PROJECT_ID }}"
          region                 = "${{ vars.GCP_REGION }}"
          cluster_name           = "${{ vars.GKE_CLUSTER_NAME }}"
          gitops_repo_url        = "${{ vars.GITOPS_REPO_URL }}"
          gitops_target_revision = "main"
          gitops_path            = "${{ vars.GITOPS_PATH }}"
          EOF

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.GCS_BUCKET_NAME }}" \
            -backend-config="prefix=bootstrap" \
            -reconfigure -input=false -no-color

      - name: Show what will be destroyed
        run: |
          terraform plan -destroy -no-color -input=false
          echo ""
          echo "L'objet root-app ArgoCD va être supprimé."
          echo "   ArgoCD arrêtera de synchroniser toutes les apps."
          echo "   Le cluster GKE et ArgoCD ne sont PAS affectés."

      - name: Terraform Destroy
        run: terraform destroy -auto-approve -no-color

      - name: Confirm destruction
        run: |
          echo "Vérification que root-app n'existe plus..."
          if kubectl get application root-app -n argocd 2>/dev/null; then
            echo "L'objet existe encore."
            exit 1
          else
            echo "root-app supprimé avec succès."
            echo "Pour recréer : workflow_dispatch → action=apply"
          fi