name: "GitOps Bootstrap"

on:
  push:
    branches: [main]
    paths:
      - "bootstrap-gitops/**"
      - ".github/workflows/workflow-gitops-bootstrap.yml"

  workflow_dispatch:
    inputs:
      action:
        description: "plan | apply | destroy"
        required: true
        default: "plan"
        type: choice
        options: [plan, apply, destroy]

  workflow_run:
    workflows: ["Terraform Infra"]
    types: [completed]
    branches: [main]

concurrency:
  group: gitops-bootstrap-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  TF_VERSION: "1.7.5"
  TF_BOOTSTRAP_DIR: "bootstrap-gitops"

jobs:
  # ─────────────────────────────────────────────────────────
  # JOB 0 — CHECK TRIGGER
  # ─────────────────────────────────────────────────────────
  check-trigger:
    name: "Check trigger validity"
    runs-on: ubuntu-latest
    outputs:
      should-run: ${{ steps.check.outputs.should-run }}
    steps:
      - name: Evaluate trigger
        id: check
        shell: bash
        run: |
          if [ "${{ github.event_name }}" == "workflow_run" ]; then
            if [ "${{ github.event.workflow_run.conclusion }}" == "success" ]; then
              echo "should-run=true" >> "$GITHUB_OUTPUT"
            else
              echo "should-run=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "should-run=true" >> "$GITHUB_OUTPUT"
          fi

  # ─────────────────────────────────────────────────────────
  # JOB 1 — PLAN
  # Deux plans séparés :
  #   plan-argocd   → toujours exécuté
  #   plan-rootapp  → seulement si CRDs existent
  # ─────────────────────────────────────────────────────────
  plan:
    name: "Plan"
    needs: check-trigger
    runs-on: ubuntu-latest
    if: |
      needs.check-trigger.outputs.should-run == 'true' &&
      (
        github.event_name != 'workflow_dispatch' ||
        inputs.action != 'destroy'
      )

    defaults:
      run:
        working-directory: ${{ env.TF_BOOTSTRAP_DIR }}

    outputs:
      argocd_exitcode: ${{ steps.plan_argocd.outputs.exitcode }}
      rootapp_exitcode: ${{ steps.plan_rootapp.outputs.exitcode }}
      crd_exists: ${{ steps.crd_check.outputs.exists }}

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.SERVICE_ACCOUNT_EMAIL }}

      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Install gke-gcloud-auth-plugin
        run: |
          gcloud components install gke-gcloud-auth-plugin --quiet
          echo "USE_GKE_GCLOUD_AUTH_PLUGIN=True" >> $GITHUB_ENV

      - name: Verify cluster exists
        run: |
          gcloud container clusters describe \
            ${{ vars.GKE_CLUSTER_NAME }} \
            --region ${{ vars.GCP_REGION }}-b \
            --project ${{ vars.GCP_PROJECT_ID }}

      - name: Get GKE credentials
        run: |
          gcloud container clusters get-credentials \
            ${{ vars.GKE_CLUSTER_NAME }} \
            --region ${{ vars.GCP_REGION }}-b \
            --project ${{ vars.GCP_PROJECT_ID }}

      - name: Write terraform.tfvars
        run: |
          cat > terraform.tfvars <<EOF
          project_id             = "${{ vars.GCP_PROJECT_ID }}"
          region                 = "${{ vars.GCP_REGION }}"
          cluster_name           = "${{ vars.GKE_CLUSTER_NAME }}"
          gitops_repo_url        = "${{ vars.GITOPS_REPO_URL }}"
          gitops_target_revision = "main"
          gitops_path            = "${{ vars.GITOPS_PATH }}"
          EOF

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.GCS_BUCKET_NAME }}" \
            -backend-config="prefix=bootstrap" \
            -reconfigure -input=false -no-color

      # ── Plan 1 : ArgoCD uniquement (pas de CRD check) ──────
      - name: Plan — ArgoCD
        id: plan_argocd
        shell: bash
        run: |
          set +e
          terraform plan \
            -target=kubernetes_namespace_v1.argocd \
            -target=helm_release.argocd \
            -no-color \
            -out=tfplan-argocd.binary \
            -detailed-exitcode \
            -input=false
          EXIT=$?
          echo "exitcode=${EXIT}" >> "$GITHUB_OUTPUT"
          echo "ArgoCD plan exitcode: ${EXIT}"
          if [ "${EXIT}" -eq 1 ]; then exit 1; fi
          exit 0

      # ── Vérifier si CRDs ArgoCD existent déjà ──────────────
      # Si oui → root_app peut être planifié maintenant
      # Si non → root_app sera appliqué après install ArgoCD
      - name: Check ArgoCD CRDs
        id: crd_check
        shell: bash
        run: |
          kubectl get crd applications.argoproj.io &>/dev/null \
            && echo "exists=true" >> "$GITHUB_OUTPUT" \
            || echo "exists=false" >> "$GITHUB_OUTPUT"

          echo "CRD exists: $(cat $GITHUB_OUTPUT | grep exists | tail -1)"

      # ── Plan 2 : root-app (seulement si CRDs présentes) ────
      - name: Plan — root-app
        id: plan_rootapp
        if: steps.crd_check.outputs.exists == 'true'
        shell: bash
        run: |
          set +e
          terraform plan \
            -target=kubernetes_manifest.root_app \
            -no-color \
            -out=tfplan-rootapp.binary \
            -detailed-exitcode \
            -input=false
          EXIT=$?
          echo "exitcode=${EXIT}" >> "$GITHUB_OUTPUT"
          echo "root-app plan exitcode: ${EXIT}"
          if [ "${EXIT}" -eq 1 ]; then exit 1; fi
          exit 0

      # Si CRDs absentes → root_app sera géré dans apply
      - name: Skip root-app plan (CRDs not ready)
        if: steps.crd_check.outputs.exists == 'false'
        run: |
          echo "exitcode=2" >> "$GITHUB_OUTPUT"
          echo "CRDs absent — root-app sera déployé après ArgoCD"
        id: plan_rootapp_skip

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-bootstrap
          path: |
            ${{ env.TF_BOOTSTRAP_DIR }}/tfplan-argocd.binary
            ${{ env.TF_BOOTSTRAP_DIR }}/tfplan-rootapp.binary
            ${{ env.TF_BOOTSTRAP_DIR }}/terraform.tfvars
          retention-days: 1

  # ─────────────────────────────────────────────────────────
  # JOB 2 — APPLY
  # Logique :
  #   Si ArgoCD needed  → installe ArgoCD → attend CRDs → apply root-app
  #   Si ArgoCD exists  → apply root-app directement (si needed)
  # ─────────────────────────────────────────────────────────
  apply:
    name: "Apply"
    needs: plan
    runs-on: ubuntu-latest
    if: |
      (
        needs.plan.outputs.argocd_exitcode == '2' ||
        needs.plan.outputs.rootapp_exitcode == '2'
      ) &&
      github.event_name != 'pull_request' &&
      (
        github.event_name != 'workflow_dispatch' ||
        inputs.action == 'apply'
      )

    defaults:
      run:
        working-directory: ${{ env.TF_BOOTSTRAP_DIR }}

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.SERVICE_ACCOUNT_EMAIL }}

      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Install gke-gcloud-auth-plugin
        run: |
          gcloud components install gke-gcloud-auth-plugin --quiet
          echo "USE_GKE_GCLOUD_AUTH_PLUGIN=True" >> $GITHUB_ENV

      - name: Get GKE credentials
        run: |
          gcloud container clusters get-credentials \
            ${{ vars.GKE_CLUSTER_NAME }} \
            --region ${{ vars.GCP_REGION }}-b \
            --project ${{ vars.GCP_PROJECT_ID }}

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: tfplan-bootstrap
          path: ${{ env.TF_BOOTSTRAP_DIR }}

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.GCS_BUCKET_NAME }}" \
            -backend-config="prefix=bootstrap" \
            -reconfigure -input=false -no-color

      # ── PHASE A : ArgoCD si nécessaire ─────────────────────
      - name: "Phase A — Apply ArgoCD"
        if: needs.plan.outputs.argocd_exitcode == '2'
        run: |
          terraform apply \
            -auto-approve \
            -no-color \
            tfplan-argocd.binary

      # ── Attendre CRDs (toujours, pour être sûr) ────────────
      - name: "Wait — ArgoCD CRD established"
        run: |
          echo "Waiting for applications.argoproj.io CRD..."
          kubectl wait --for=condition=established \
            crd/applications.argoproj.io \
            --timeout=120s
          echo "CRD ready"

      # ── Attendre ArgoCD server ──────────────────────────────
      - name: "Wait — ArgoCD server pod ready"
        run: |
          kubectl wait --for=condition=Ready pods \
            -l app.kubernetes.io/name=argocd-server \
            -n argocd \
            --timeout=300s
          echo "ArgoCD server ready"

      # ── PHASE B : root-app ─────────────────────────────────
      # Utilise le plan sauvegardé si disponible
      # Sinon fait un apply ciblé (cas CRDs absentes au moment du plan)
      - name: "Phase B — Apply root-app (from saved plan)"
        if: |
          needs.plan.outputs.crd_exists == 'true' &&
          needs.plan.outputs.rootapp_exitcode == '2'
        run: |
          terraform apply \
            -auto-approve \
            -no-color \
            tfplan-rootapp.binary

      - name: "Phase B — Apply root-app (fresh plan)"
        if: needs.plan.outputs.crd_exists == 'false'
        run: |
          terraform apply \
            -target=kubernetes_manifest.root_app \
            -auto-approve \
            -no-color

      # ── Vérifications ──────────────────────────────────────
      - name: "Verify — root-app exists"
        run: |
          kubectl get application root-app -n argocd
          echo "root-app created"

      - name: "Verify — todo-staging synced"
        run: |
          kubectl wait \
            --for=jsonpath='{.status.sync.status}'=Synced \
            application/todo-staging \
            -n argocd \
            --timeout=180s
          echo "todo-staging synced"

  # ─────────────────────────────────────────────────────────
  # JOB 3 — DESTROY
  # ─────────────────────────────────────────────────────────
  destroy:
    name: "Destroy — GitOps Bootstrap"
    needs: check-trigger
    runs-on: ubuntu-latest
    if: |
      needs.check-trigger.outputs.should-run == 'true' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.action == 'destroy'
    environment: gitops-destroy

    defaults:
      run:
        working-directory: ${{ env.TF_BOOTSTRAP_DIR }}

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.SERVICE_ACCOUNT_EMAIL }}

      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Install gke-gcloud-auth-plugin
        run: |
          gcloud components install gke-gcloud-auth-plugin --quiet
          echo "USE_GKE_GCLOUD_AUTH_PLUGIN=True" >> $GITHUB_ENV

      - name: Verify cluster exists
        run: |
          gcloud container clusters describe \
            ${{ vars.GKE_CLUSTER_NAME }} \
            --region ${{ vars.GCP_REGION }}-b \
            --project ${{ vars.GCP_PROJECT_ID }}

      - name: Get GKE credentials
        run: |
          gcloud container clusters get-credentials \
            ${{ vars.GKE_CLUSTER_NAME }} \
            --region ${{ vars.GCP_REGION }}-b \
            --project ${{ vars.GCP_PROJECT_ID }}

      - name: Write terraform.tfvars
        run: |
          cat > terraform.tfvars <<EOF
          project_id             = "${{ vars.GCP_PROJECT_ID }}"
          region                 = "${{ vars.GCP_REGION }}"
          cluster_name           = "${{ vars.GKE_CLUSTER_NAME }}"
          gitops_repo_url        = "${{ vars.GITOPS_REPO_URL }}"
          gitops_target_revision = "main"
          gitops_path            = "${{ vars.GITOPS_PATH }}"
          EOF

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.GCS_BUCKET_NAME }}" \
            -backend-config="prefix=bootstrap" \
            -reconfigure -input=false -no-color

      - name: Show what will be destroyed
        run: terraform plan -destroy -no-color -input=false

      - name: Terraform Destroy
        run: terraform destroy -auto-approve -no-color

      - name: Confirm destruction
        run: |
          kubectl get application root-app -n argocd 2>/dev/null \
            && { echo "root-app existe encore"; exit 1; } \
            || echo "root-app supprimé avec succès"