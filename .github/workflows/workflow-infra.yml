name: "Terraform Infra"

on:
  push:
    branches: [main]
    paths:
      - "environments/**"
      - "modules/**"
      - "backend-config/**"
      - ".github/workflows/workflow-infra.yml"
      - ".checkov.yaml"

  pull_request:
    branches: [main]
    paths:
      - "environments/**"
      - "modules/**"

  schedule:
    - cron: "30 13 * * *"

  workflow_dispatch:
    inputs:
      action:
        description: "plan | apply | destroy-staging | drift | bootstrap | unlock"
        required: true
        default: "plan"
        type: choice
        options: [plan, apply, destroy-staging, drift, bootstrap, unlock]

concurrency:
  group: terraform-infra-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write
  pull-requests: write
  issues: write
  security-events: write

env:
  TF_VERSION: "1.7.5"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_STAGING_DIR: "environments/staging"
  ARGOCD_CHART_VERSION: "6.7.3"

jobs:
  # ─────────────────────────────────────────────────────────
  # JOB 1 — VALIDATE  (fmt + terraform validate only — fast gate ~30s)
  # ─────────────────────────────────────────────────────────
  validate:
    name: "Validate"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Check formatting
        run: terraform fmt -check -recursive

      - name: Validate modules
        run: |
          for d in backend-config environments/staging \
                   modules/gke modules/networking \
                   modules/artifact_registry modules/iam; do
            [ -d "$d" ] || continue
            echo "── Validating: $d"
            (cd "$d" && \
              terraform init -backend=false -input=false -no-color && \
              terraform validate -no-color)
          done

  # ─────────────────────────────────────────────────────────
  # JOB 1B — LINT  (tflint — runs in parallel with security)
  # ─────────────────────────────────────────────────────────
  lint:
    name: "Lint (tflint)"
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.50.3

      - name: Run tflint
        run: tflint --recursive --format compact

  # ─────────────────────────────────────────────────────────
  # JOB 1C — SECURITY  (checkov — runs in parallel with lint)
  #
  # Gating:  CRITICAL/HIGH  → hard fail  (blocks plan + apply)
  #          MEDIUM/LOW     → soft fail  (reported, never blocks)
  #
  # Native GitHub outputs — no third-party actions:
  #   console  → job log      (immediate inline feedback)
  #   sarif    → Code Scanning tab (persistent, inline PR annotations)
  #   artifact → downloadable (30-day retention)
  # ─────────────────────────────────────────────────────────
  # security:
  #   name: "Security (checkov)"
  #   needs: validate
  #   runs-on: ubuntu-latest
  #   permissions:
  #     contents: read
  #     security-events: write

  #   steps:
  #     - uses: actions/checkout@v4

  #     - name: Run Checkov
  #       uses: bridgecrewio/checkov-action@v12.2847.0
  #       with:
  #         config_file: .checkov.yaml
  #         output_format: cli,sarif
  #         output_file_path: console,results.sarif

  #     - name: Upload SARIF to GitHub Code Scanning
  #       uses: github/codeql-action/upload-sarif@v3
  #       if: always()
  #       with:
  #         sarif_file: results.sarif
  #         category: checkov-terraform

  #     - name: Upload scan artifact
  #       uses: actions/upload-artifact@v4
  #       if: always()
  #       with:
  #         name: checkov-scan-${{ github.run_number }}
  #         path: results.sarif
  #         retention-days: 30

  # ─────────────────────────────────────────────────────────
  # JOB 2 — PLAN PHASE A
  # ─────────────────────────────────────────────────────────
  plan:
    name: "Plan — Infra (staging)"
    needs: [validate, lint, security]
    runs-on: ubuntu-latest
    if: |
      (
        github.event_name != 'pull_request' ||
        github.event.pull_request.head.repo.fork == false
      ) &&
      (
        github.event_name != 'workflow_dispatch' ||
        inputs.action != 'destroy-staging'
      )

    defaults:
      run:
        working-directory: ${{ env.TF_STAGING_DIR }}

    outputs:
      exitcode: ${{ steps.plan.outputs.exitcode }}

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.SERVICE_ACCOUNT_EMAIL }}

      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Write terraform.tfvars
        run: |
          cat > terraform.tfvars <<EOF
          project_id    = "${{ vars.GCP_PROJECT_ID }}"
          cluster_name  = "${{ vars.GKE_CLUSTER_NAME }}"
          registry_name = "${{ vars.GAR_REPOSITORY_NAME }}"
          region        = "${{ vars.GCP_REGION }}"
          node_count    = ${{ vars.NODE_COUNT }}
          node_vm_size  = "${{ vars.NODE_VM_SIZE }}"
          EOF

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.GCS_BUCKET_NAME }}" \
            -backend-config="prefix=staging" \
            -reconfigure -input=false -no-color

      - name: Terraform Plan
        id: plan
        shell: bash
        run: |
          set +e

          terraform plan \
            -no-color \
            -out=tfplan.binary \
            -detailed-exitcode \
            -input=false
          EXIT=$?

          echo "exitcode=${EXIT}" >> "$GITHUB_OUTPUT"

          case "${EXIT}" in
            0) echo " No changes — infrastructure is up to date." ;;
            1) echo " Terraform error." ;;
            2) echo " Changes detected — apply will run." ;;
          esac

          if [ "${EXIT}" -eq 1 ]; then exit 1; fi
          exit 0

      - name: Release lock on failure
        if: failure()
        run: |
          LOCK_ID=$(gsutil cat gs://${{ vars.GCS_BUCKET_NAME }}/staging/default.tflock \
            2>/dev/null | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['ID'])" \
            2>/dev/null || echo "")
          if [ -n "$LOCK_ID" ]; then
            echo "Releasing stale lock: $LOCK_ID"
            terraform force-unlock -force "$LOCK_ID" 2>/dev/null || true
          else
            echo "No lock to remove"
          fi

      - name: Convert plan to JSON
        if: steps.plan.outputs.exitcode == '2'
        run: terraform show -json tfplan.binary > tfplan.json
      - name: Write plan summary
        if: steps.plan.outputs.exitcode == '2'
        run: |
          echo "## Terraform Plan — Infra staging" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          terraform show -no-color tfplan.binary >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload plan artifact
        if: steps.plan.outputs.exitcode == '2'
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-infra
          path: |
            ${{ env.TF_STAGING_DIR }}/tfplan.binary
            ${{ env.TF_STAGING_DIR }}/tfplan.json
            ${{ env.TF_STAGING_DIR }}/terraform.tfvars
          retention-days: 1

      - name: Comment plan on PR
        if: |
          github.event_name == 'pull_request' &&
          steps.plan.outputs.exitcode == '2'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let planJson = {};
            try {
              planJson = JSON.parse(fs.readFileSync(
                '${{ env.TF_STAGING_DIR }}/tfplan.json', 'utf8'
              ));
            } catch(e) {}

            const changes = planJson.resource_changes || [];
            const toAdd     = changes.filter(r =>
              r.change.actions.includes('create') &&
              !r.change.actions.includes('delete')).length;
            const toChange  = changes.filter(r =>
              r.change.actions.includes('update')).length;
            const toDestroy = changes.filter(r =>
              r.change.actions[0] === 'delete').length;

            const rows = changes
              .filter(r => r.change.actions[0] !== 'no-op')
              .map(r => `- \`${r.change.actions.join('/')}\` **${r.address}**`)
              .join('\n');

            const body = `## Terraform Plan — Infra staging

            | Action  | Count |
            |---------|------:|
            | Create  | ${toAdd} |
            | Update  | ${toChange} |
            | Destroy | ${toDestroy} |

            <details><summary>Détail des ressources</summary>

            ${rows || '_Aucun changement de ressource._'}
            </details>

            > Commit: \`${{ github.sha }}\``;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });

  # ─────────────────────────────────────────────────────────
  # JOB 3 — APPLY
  # ─────────────────────────────────────────────────────────
  apply:
    name: "Apply — Infra (staging)"
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging-apply  
    if: |
      needs.plan.outputs.exitcode == '2' &&
      github.event_name != 'pull_request' &&
      (
        github.event_name == 'push' ||
        (github.event_name == 'workflow_dispatch' &&
        inputs.action == 'apply')
      )

    defaults:
      run:
        working-directory: ${{ env.TF_STAGING_DIR }}

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.SERVICE_ACCOUNT_EMAIL }}

      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan-infra
          path: ${{ env.TF_STAGING_DIR }}

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.GCS_BUCKET_NAME }}" \
            -backend-config="prefix=staging" \
            -reconfigure -input=false -no-color

      - name: Terraform Apply
        run: terraform apply -auto-approve -no-color tfplan.binary

      - name: Release lock on failure
        if: failure()
        run: |
          terraform force-unlock -force \
            $(gsutil cat gs://${{ vars.GCS_BUCKET_NAME }}/staging/default.tflock \
              2>/dev/null | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['ID'])" \
              2>/dev/null || echo "") \
            2>/dev/null || echo "No lock to remove"

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ vars.GKE_CLUSTER_NAME }}
          location: ${{ vars.GCP_REGION }}-b
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Wait for GKE to be fully ready
        run: |
          kubectl wait --for=condition=Ready nodes \
            --all \
            --timeout=300s
          echo "GKE cluster fully ready"

  # ─────────────────────────────────────────────────────────
  # JOB 3B — BOOTSTRAP ARGOCD
  # Remplace le module bootstrap-gitops Terraform.
  # Toutes les étapes sont idempotentes — safe à relancer.
  # Déclenché : après apply réussi OU manuellement via bootstrap.
  # ─────────────────────────────────────────────────────────
  bootstrap-argocd:
    name: "Bootstrap ArgoCD"
    needs: [plan, apply]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # always() nécessaire pour tourner même quand apply est skipped.
    # apply est skipped quand plan exitcode=0 (infra déjà à jour).
    # Le check interne "already_bootstrapped" rend le job rapide (~5s)
    # si ArgoCD tourne déjà — pas de réinstallation inutile.
    if: |
      always() &&
      needs.apply.result != 'failure' &&
      needs.plan.result != 'failure' &&
      github.event_name != 'pull_request' &&
      (github.event_name != 'workflow_dispatch' || inputs.action != 'destroy-staging')

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.SERVICE_ACCOUNT_EMAIL }}

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ vars.GKE_CLUSTER_NAME }}
          location: ${{ vars.GCP_REGION }}-b
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Check if ArgoCD already bootstrapped
        id: check
        run: |
          FORCE="${{ github.event_name == 'workflow_dispatch' && inputs.action == 'bootstrap' }}"
          if [ "$FORCE" = "true" ]; then
            echo "already_bootstrapped=false" >> "$GITHUB_OUTPUT"
            echo "Force bootstrap requested — running full bootstrap"
          elif kubectl get namespace argocd &>/dev/null && \
               kubectl get application root-app -n argocd &>/dev/null; then
            echo "already_bootstrapped=true" >> "$GITHUB_OUTPUT"
            echo "ArgoCD already running — skipping bootstrap"
          else
            echo "already_bootstrapped=false" >> "$GITHUB_OUTPUT"
            echo "ArgoCD not found — bootstrap needed"
          fi

      - name: Install ArgoCD via Helm
        if: steps.check.outputs.already_bootstrapped == 'false'
        run: |
          kubectl create namespace argocd --dry-run=client -o yaml | kubectl apply -f -
          helm repo add argo https://argoproj.github.io/argo-helm --force-update
          helm upgrade --install argocd argo/argo-cd \
            --version ${{ env.ARGOCD_CHART_VERSION }} \
            --namespace argocd \
            --set server.service.type=ClusterIP \
            --wait \
            --timeout 600s

      - name: Wait for ArgoCD CRDs
        if: steps.check.outputs.already_bootstrapped == 'false'
        run: |
          kubectl wait --for=condition=established \
            crd/applications.argoproj.io \
            --timeout=120s
          echo "CRDs ready"

      - name: Wait for ArgoCD server
        if: steps.check.outputs.already_bootstrapped == 'false'
        run: |
          kubectl wait --for=condition=Ready pods \
            -l app.kubernetes.io/name=argocd-server \
            -n argocd \
            --timeout=300s
          echo "ArgoCD server ready"

      - name: Checkout todo-config
        if: steps.check.outputs.already_bootstrapped == 'false'
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.GITOPS_REPO }}
          path: repo-config

      - name: Apply root-app
        if: steps.check.outputs.already_bootstrapped == 'false'
        run: kubectl apply -f repo-config/apps/root-app.yaml

      - name: Verify ArgoCD and root-app
        run: |
          echo "=== ArgoCD pods ==="
          kubectl get pods -n argocd

          echo ""
          echo "=== ArgoCD Applications ==="
          kubectl get applications -n argocd

          echo ""
          echo "=== root-app sync status ==="
          kubectl get application root-app -n argocd \
            -o jsonpath='SyncStatus: {.status.sync.status}{"\n"}Health: {.status.health.status}{"\n"}'

  # ─────────────────────────────────────────────────────────
  # JOB 4 — DRIFT DETECTION
  # ─────────────────────────────────────────────────────────
  detect-drift:
    name: "Detect infrastructure drift"
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' &&
       inputs.action == 'drift')

    defaults:
      run:
        working-directory: ${{ env.TF_STAGING_DIR }}

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.SERVICE_ACCOUNT_EMAIL }}

      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Write terraform.tfvars
        run: |
          cat > terraform.tfvars <<EOF
          project_id    = "${{ vars.GCP_PROJECT_ID }}"
          cluster_name  = "${{ vars.GKE_CLUSTER_NAME }}"
          registry_name = "${{ vars.GAR_REPOSITORY_NAME }}"
          region        = "${{ vars.GCP_REGION }}"
          node_count    = ${{ vars.NODE_COUNT }}
          node_vm_size  = "${{ vars.NODE_VM_SIZE }}"
          EOF

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.GCS_BUCKET_NAME }}" \
            -backend-config="prefix=staging" \
            -reconfigure -input=false -no-color

      - name: Detect drift
        id: drift
        shell: bash
        run: |
          set +e

          terraform plan \
            -refresh-only \
            -detailed-exitcode \
            -no-color \
            -out=drift.binary 2>&1 | tee drift.log

          EXIT=$?
          echo "drift_exitcode=${EXIT}" >> "$GITHUB_OUTPUT"

          case "${EXIT}" in
            0) echo "Infrastructure in sync." ;;
            1) echo " Error during refresh." ;;
            2) echo " DRIFT DETECTED." ;;
          esac

          if [ "${EXIT}" -eq 1 ]; then exit 1; fi
          exit 0

      - name: Open drift issue
        if: steps.drift.outputs.drift_exitcode == '2'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const log = fs.existsSync('${{ env.TF_STAGING_DIR }}/drift.log')
              ? fs.readFileSync('${{ env.TF_STAGING_DIR }}/drift.log', 'utf8').slice(0, 3000)
              : 'Log not available.';

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'terraform-drift',
              state: 'open'
            });

            if (existing.data.length > 0) {
              console.log('Drift issue already open — skipping.');
              return;
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[Drift] GCP infra differs from tfstate — ${new Date().toISOString().slice(0,10)}`,
              labels: ['terraform-drift'],
              body: `## Infrastructure drift detected\n\n<details><summary>Log</summary>\n\n\`\`\`\n${log}\n\`\`\`\n</details>`
            });

  # ─────────────────────────────────────────────────────────
  # JOB 5 — DESTROY
  # ─────────────────────────────────────────────────────────
  destroy:
    name: "Destroy staging"
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' &&
      inputs.action == 'destroy-staging'
    environment: staging-destroy
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.SERVICE_ACCOUNT_EMAIL }}

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ vars.GKE_CLUSTER_NAME }}
          location: ${{ vars.GCP_REGION }}-b
          project_id: ${{ vars.GCP_PROJECT_ID }}
      - name: Write terraform.tfvars
        working-directory: ${{ env.TF_STAGING_DIR }}
        run: |
          cat > terraform.tfvars <<EOF
          project_id    = "${{ vars.GCP_PROJECT_ID }}"
          cluster_name  = "${{ vars.GKE_CLUSTER_NAME }}"
          registry_name = "${{ vars.GAR_REPOSITORY_NAME }}"
          region        = "${{ vars.GCP_REGION }}"
          node_count    = ${{ vars.NODE_COUNT }}
          node_vm_size  = "${{ vars.NODE_VM_SIZE }}"
          EOF
      - name: Terraform Init
        working-directory: ${{ env.TF_STAGING_DIR }}
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.GCS_BUCKET_NAME }}" \
            -backend-config="prefix=staging" \
            -reconfigure -input=false -no-color

      - name: Graceful ArgoCD cleanup before cluster destruction
        run: |
          if kubectl get application root-app -n argocd &>/dev/null; then
            # Strip the cascade-delete finalizer before deleting.
            # The finalizer blocks deletion until ArgoCD removes every child
            # resource — which can take minutes. Since we are destroying the
            # entire cluster, GCP will clean everything up; no cascade needed.
            echo "Removing finalizer from root-app..."
            kubectl patch application root-app -n argocd \
              -p '{"metadata":{"finalizers":null}}' \
              --type=merge
            kubectl delete application root-app -n argocd --timeout=30s --ignore-not-found
            echo "root-app deleted"
          else
            echo "root-app not found — skipping"
          fi

          if helm status argocd -n argocd &>/dev/null; then
            echo "Uninstalling ArgoCD..."
            helm uninstall argocd -n argocd --timeout 120s
            kubectl delete namespace argocd --timeout=60s --ignore-not-found
            echo "ArgoCD uninstalled"
          fi

      - name: Terraform Destroy
        working-directory: ${{ env.TF_STAGING_DIR }}
        run: terraform destroy -auto-approve -no-color

  # ─────────────────────────────────────────────────────────
  # JOB 6 — UNLOCK (escape hatch for stale state locks)
  # Trigger: workflow_dispatch → action = unlock
  # Use when a cancelled/timed-out apply leaves a stale lock.
  # ─────────────────────────────────────────────────────────
  unlock:
    name: "Force-unlock Terraform state"
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' &&
      inputs.action == 'unlock'

    defaults:
      run:
        working-directory: ${{ env.TF_STAGING_DIR }}

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.SERVICE_ACCOUNT_EMAIL }}

      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.GCS_BUCKET_NAME }}" \
            -backend-config="prefix=staging" \
            -reconfigure -input=false -no-color

      - name: Release stale lock
        run: |
          LOCK_ID=$(gsutil cat gs://${{ vars.GCS_BUCKET_NAME }}/staging/default.tflock \
            2>/dev/null | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['ID'])" \
            2>/dev/null || echo "")
          if [ -n "$LOCK_ID" ]; then
            echo "Releasing lock: $LOCK_ID"
            terraform force-unlock -force "$LOCK_ID"
            echo "Lock released — you can now re-run plan/apply."
          else
            echo "No stale lock found — state is clean."
          fi
