name: "Terraform CI"

on:
  push:
    branches: [main]
    paths:
      - "backend-config/**"
      - "bootstrap-gitops/**"
      - "environments/**"
      - "modules/**"
      - ".github/workflows/ci.yml"

  pull_request:
    branches: [main]
    paths:
      - "backend-config/**"
      - "bootstrap-gitops/**"
      - "environments/**"
      - "modules/**"

  workflow_dispatch:
    inputs:
      action:
        description: "plan | apply | destroy-staging"
        required: true
        default: "apply"
        type: choice
        options: [plan, apply, destroy-staging]

      phase:
        description: "target phase"
        required: true
        default: "all"
        type: choice
        options: [all, phase-a-infra, phase-b-gitops]

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write
  pull-requests: write

env:
  TF_VERSION: "1.7.5"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_CLI_ARGS: "-no-color"

# ─────────────────────────────────────────────
jobs:
# =========================================================
# 1. VALIDATION
# =========================================================
 terraform-validate:
  name: Validate
  runs-on: ubuntu-latest

  steps:
    - uses: actions/checkout@v4

    - uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ${{ env.TF_VERSION }}

    - name: Check formatting
      run: terraform fmt -check -recursive

    - name: Validate modules
      run: |
        for d in backend-config environments/staging bootstrap-gitops modules/*; do
          [ -d "$d" ] || continue
          echo "Validating $d"
          (cd "$d" && terraform init -backend=false -input=false && terraform validate)
        done


# =========================================================
# 2. PHASE A — INFRA (GKE + NETWORK + REGISTRY + ARGOCD)
# =========================================================
 phase-a-infra:
  name: Phase A — Infra
  needs: terraform-validate
  runs-on: ubuntu-latest

  if: |
    github.event_name != 'pull_request' ||
    github.event.pull_request.head.repo.fork == false

  defaults:
    run:
      working-directory: environments/staging

  steps:
    - uses: actions/checkout@v4

    - uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ${{ env.TF_VERSION }}

    - name: Authenticate (OIDC)
      uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
        service_account: ${{ secrets.SERVICE_ACCOUNT_EMAIL }}

    - name: Setup gcloud
      uses: google-github-actions/setup-gcloud@v2
      with:
        project_id: ${{ vars.GCP_PROJECT_ID }}

    # ─────────────────────────────────────────────
    # INLINE BACKEND CONFIG (NO FILE)
    # ─────────────────────────────────────────────
    - name: Terraform Init
      run: |
        terraform init \
          -backend-config="bucket=${{ vars.GCS_BUCKET_NAME }}" \
          -backend-config="prefix=staging" \
          -reconfigure -input=false

    - name: Terraform Plan
      id: plan
      run: |
        set +e
        terraform plan -out=tfplan -detailed-exitcode -input=false
        echo "exitcode=$?" >> $GITHUB_OUTPUT

    - name: Upload plan
      uses: actions/upload-artifact@v4
      with:
        name: tfplan
        path: environments/staging/tfplan

    # ─────────────────────────────────────────────
    # APPLY
    # ─────────────────────────────────────────────
    - name: Apply infra
      if: |
        steps.plan.outputs.exitcode == '2' &&
        (
          github.event_name == 'push' ||
          (github.event_name == 'workflow_dispatch' && inputs.action == 'apply')
        )
      run: terraform apply -auto-approve tfplan


# =========================================================
# 3. PHASE B — GITOPS BOOTSTRAP
# =========================================================
 phase-b-gitops:
  name: Phase B — GitOps
  needs: phase-a-infra
  runs-on: ubuntu-latest

  if: |
    needs.phase-a-infra.result == 'success' &&
    (
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' &&
       inputs.action == 'apply' &&
       inputs.phase == 'all')
    )

  defaults:
    run:
      working-directory: bootstrap-gitops

  steps:
    - uses: actions/checkout@v4

    - uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ${{ env.TF_VERSION }}

    - name: Authenticate (OIDC)
      uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
        service_account: ${{ secrets.SERVICE_ACCOUNT_EMAIL }}

    - name: Get cluster creds
      run: |
        gcloud container clusters get-credentials \
          ${{ vars.GKE_CLUSTER_NAME }} \
          --region ${{ vars.GCP_REGION }} \
          --project ${{ vars.GCP_PROJECT_ID }}

    - name: Terraform Init
      run: |
        terraform init \
          -backend-config="bucket=${{ vars.GCS_BUCKET_NAME }}" \
          -backend-config="prefix=bootstrap" \
          -reconfigure -input=false

    - name: Terraform Plan
      id: plan
      run: |
        set +e
        terraform plan -out=tfplan -detailed-exitcode
        echo "exitcode=$?" >> $GITHUB_OUTPUT

    - name: Apply GitOps
      if: steps.plan.outputs.exitcode == '2'
      run: terraform apply -auto-approve tfplan


# =========================================================
# 4. DESTROY (PROTECTED)
# =========================================================
 terraform-destroy:
  name: Destroy Staging
  runs-on: ubuntu-latest

  if: github.event_name == 'workflow_dispatch' && inputs.action == 'destroy-staging'

  environment: staging-destroy

  steps:
    - uses: actions/checkout@v4

    - uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ${{ env.TF_VERSION }}

    - name: Authenticate (OIDC)
      uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
        service_account: ${{ secrets.SERVICE_ACCOUNT_EMAIL }}

    # Destroy GitOps first
    - name: Destroy GitOps
      working-directory: bootstrap-gitops
      run: |
        terraform init \
          -backend-config="bucket=${{ vars.GCS_BUCKET_NAME }}" \
          -backend-config="prefix=bootstrap" \
          -reconfigure -input=false

        terraform destroy -auto-approve || true

    # Destroy Infra
    - name: Destroy Infra
      working-directory: environments/staging
      run: |
        terraform init \
          -backend-config="bucket=${{ vars.GCS_BUCKET_NAME }}" \
          -backend-config="prefix=staging" \
          -reconfigure -input=false

        terraform destroy -auto-approve