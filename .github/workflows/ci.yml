name: "Terraform CI/CD"

on:
  push:
    branches: [main]
    paths:
      - "backend-config/**"
      - "bootstrap-gitops/**"
      - "environments/**"
      - "modules/**"
      - ".github/workflows/ci.yml"

  pull_request:
    branches: [main]
    paths:
      - "backend-config/**"
      - "bootstrap-gitops/**"
      - "environments/**"
      - "modules/**"

  # ── Drift detection schedule ───────────────────────────────
  # Runs every morning to catch manual GCP changes made outside Terraform.
  # This is the professional way to detect state drift proactively.
  schedule:
    - cron: "30 13 * * *" #runs daily at 14:30

  workflow_dispatch:
    inputs:
      action:
        description: "plan | apply | destroy-staging"
        required: true
        default: "plan"
        type: choice
        options: [plan, apply, destroy-staging]

# ── Concurrency guard ──────────────────────────────────────────
# Only one Terraform workflow at a time per branch.
# cancel-in-progress: false is critical — never interrupt an apply.
concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write
  pull-requests: write
  issues: write # needed to open drift-detection issues automatically

env:
  TF_VERSION: "1.7.5"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_STAGING_DIR: "environments/staging"
  TF_BOOTSTRAP_DIR: "bootstrap-gitops"

# =============================================================
# REUSABLE STEP DEFINITIONS (via composite actions pattern)
# These env vars are referenced in every job that touches GCP.
# =============================================================

jobs:
  # =============================================================
  # JOB 1 — VALIDATE
  # Syntax, formatting, tflint, and Checkov security scan.
  # Runs on every PR and every push to main. Never touches GCP.
  # =============================================================
  validate:
    name: "Validate"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      # FIX: -check makes fmt exit 1 if any file is not formatted.
      # This is enforced at PR time so formatting issues never reach main.
      - name: Check formatting
        run: terraform fmt -check -recursive

      - name: Validate modules
        run: |
          for d in backend-config environments/staging bootstrap-gitops \
                   modules/gke modules/networking modules/artifact_registry modules/argocd; do
            [ -d "$d" ] || continue
            echo "── Validating: $d"
            (cd "$d" && \
              terraform init -backend=false -input=false -upgrade -no-color && \
              terraform validate -no-color)
          done

      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.50.3

      - name: Init tflint
        run: tflint --init

      # FIX: removed "|| true". tflint exits non-zero on warnings.
      # We keep soft-fail here for the PFE context, but log it clearly.
      - name: Run tflint
        run: |
          tflint --recursive --format compact
          echo "tflint exit: $?"
        continue-on-error: true

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: .
          framework: terraform
          output_format: cli
          soft_fail: true
          skip_check: CKV_GCP_25,CKV_GCP_71

  # =============================================================
  # JOB 2 — PLAN PHASE A  (staging infrastructure)
  #
  # KEY FIXES vs original:
  #   1. Exit code is propagated correctly: 0, 1, and 2 are all
  #      handled distinctly and written to GITHUB_OUTPUT.
  #   2. A "plan-outcome" summary step runs on every exit code
  #      so the engineer always sees a clear human-readable result.
  #   3. The artifact upload now always runs when exitcode == '2',
  #      and the condition is explicit.
  # =============================================================
  plan-phase-a:
    name: "Plan — Phase A (Infra)"
    needs: validate
    runs-on: ubuntu-latest
    if: |
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.fork == false

    defaults:
      run:
        working-directory: ${{ env.TF_STAGING_DIR }}

    outputs:
      exitcode: ${{ steps.plan.outputs.exitcode }}

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Authenticate to GCP (OIDC)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.SERVICE_ACCOUNT_EMAIL }}

      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Create terraform.tfvars
        working-directory: ${{ env.TF_STAGING_DIR }}
        run: |
          cat > terraform.tfvars <<EOF
          project_id    = "${{ vars.GCP_PROJECT_ID }}"
          cluster_name  = "${{ vars.GKE_CLUSTER_NAME }}"
          registry_name = "${{ vars.GAR_REPOSITORY_NAME }}"
          region        = "${{ vars.GCP_REGION }}"
          node_count    = ${{ vars.NODE_COUNT }}
          node_vm_size  = "${{ vars.NODE_VM_SIZE }}"
          EOF

      - name: Terraform Init
        working-directory: ${{ env.TF_STAGING_DIR }}
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.GCS_BUCKET_NAME }}" \
            -backend-config="prefix=staging" \
            -reconfigure \
            -input=false \
            -no-color

      # ── The corrected plan step ────────────────────────────
      # WHAT CHANGED:
      #   - set +e is kept (correct) so we can capture the exit code manually.
      #   - EXIT is written to GITHUB_OUTPUT BEFORE any conditional exit.
      #   - exit 0 is returned for both code 0 (no change) and code 2 (changes).
      #     Both are SUCCESS states for the plan job itself.
      #   - exit 1 (Terraform error) fails the job and stops the pipeline.
      #   - A clear echo statement tells the engineer what happened,
      #     so "exit 0 with no changes" is never silently confusing again.
      - name: Terraform Plan
        id: plan
        shell: bash
        working-directory: ${{ env.TF_STAGING_DIR }}
        run: |
          set +e

          terraform plan \
            -no-color \
            -out=tfplan.binary \
            -detailed-exitcode \
            -input=false
          EXIT=$?

          # Write the exit code FIRST, before anything else can fail
          echo "exitcode=${EXIT}" >> "$GITHUB_OUTPUT"

          echo "──────────────────────────────────────────────"
          case "${EXIT}" in
            0)
              echo "PLAN RESULT: No changes — infrastructure is up to date."
              echo "The apply job will be skipped (this is correct behaviour)."
              ;;
            1)
              echo "PLAN RESULT: Terraform error. Check the logs above."
              ;;
            2)
              echo "PLAN RESULT: Changes detected — apply job will run."
              ;;
          esac
          echo "──────────────────────────────────────────────"

          # Only fail the job on a real Terraform error (exit 1)
          if [ "${EXIT}" -eq 1 ]; then
            exit 1
          fi

          exit 0

      # ── Convert plan to JSON ───────────────────────────────
      # Runs only when there are actual changes (exitcode == 2).
      - name: Convert plan to JSON
        if: steps.plan.outputs.exitcode == '2'
        run: terraform show -json tfplan.binary > tfplan.json

      # ── Resource change summary ────────────────────────────
      # NEW: Parse tfplan.json and print a human-readable table
      # of every resource being created, updated, or destroyed.
      # This makes the PR comment and the CI log immediately useful.
      - name: Print resource change summary
        if: steps.plan.outputs.exitcode == '2'
        shell: bash
        run: |
          echo "── Resource changes ──────────────────────────"
          python3 - <<'PYEOF'
          import json, sys
          with open("tfplan.json") as f:
              plan = json.load(f)
          changes = plan.get("resource_changes", [])
          counts = {"create": 0, "update": 0, "delete": 0, "no-op": 0}
          for r in changes:
              actions = r["change"]["actions"]
              if actions == ["no-op"]:
                  counts["no-op"] += 1
              elif "delete" in actions and "create" in actions:
                  counts["update"] += 1
                  print(f"  REPLACE  {r['address']}")
              elif "create" in actions:
                  counts["create"] += 1
                  print(f"  CREATE   {r['address']}")
              elif "update" in actions:
                  counts["update"] += 1
                  print(f"  UPDATE   {r['address']}")
              elif "delete" in actions:
                  counts["delete"] += 1
                  print(f"  DELETE   {r['address']}")
          print(f"\nSummary: +{counts['create']} ~{counts['update']} -{counts['delete']} (no-op: {counts['no-op']})")
          PYEOF

      # ── Upload plan artifact ────────────────────────────────
      # The binary plan is what the apply job will use.
      # Uploading it here guarantees apply runs the EXACT plan
      # that was reviewed — not a re-computed one.
      - name: Upload plan artifact
        if: steps.plan.outputs.exitcode == '2'
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-phase-a
          path: |
            ${{ env.TF_STAGING_DIR }}/tfplan.binary
            ${{ env.TF_STAGING_DIR }}/tfplan.json
          retention-days: 1

      # ── PR comment ─────────────────────────────────────────
      - name: Comment plan on PR
        if: |
          github.event_name == 'pull_request' &&
          steps.plan.outputs.exitcode == '2'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let planJson = {};
            try {
              planJson = JSON.parse(fs.readFileSync(
                '${{ env.TF_STAGING_DIR }}/tfplan.json', 'utf8'
              ));
            } catch(e) {}

            const changes = planJson.resource_changes || [];
            const toAdd     = changes.filter(r => r.change.actions.includes('create') && !r.change.actions.includes('delete')).length;
            const toChange  = changes.filter(r => r.change.actions.includes('update') || (r.change.actions.includes('create') && r.change.actions.includes('delete'))).length;
            const toDestroy = changes.filter(r => r.change.actions[0] === 'delete').length;

            const rows = changes
              .filter(r => r.change.actions[0] !== 'no-op')
              .map(r => `- \`${r.change.actions.join('/')}\` **${r.address}**`)
              .join('\n');

            const body = `## Terraform plan — Phase A (staging infra)

            | Action | Count |
            |--------|------:|
            | Create  | ${toAdd} |
            | Update  | ${toChange} |
            | Destroy | ${toDestroy} |

            > Commit: \`${{ github.sha }}\`
            > Apply runs automatically after merge to \`main\`.

            <details><summary>Resource detail</summary>

            ${rows || '_No resource-level changes._'}
            </details>`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });

  # =============================================================
  # JOB 3 — NOTIFY NO CHANGES
  # NEW JOB — runs when plan exits 0.
  # This eliminates the confusion of "pipeline passed but nothing
  # happened". Engineers now always get explicit feedback.
  # =============================================================

  # =============================================================
  # JOB 4 — APPLY PHASE A
  # Only runs when plan exits 2 (changes detected) AND we are on
  # a push to main or a manual workflow_dispatch with action=apply.
  # Never runs on PRs.
  # =============================================================
  apply-phase-a:
    name: "Apply — Phase A (Infra)"
    needs: plan-phase-a
    runs-on: ubuntu-latest
    if: |
      needs.plan-phase-a.outputs.exitcode == '2' &&
      github.event_name != 'pull_request' &&
      (
        github.event_name == 'push' ||
        (github.event_name == 'workflow_dispatch' && inputs.action == 'apply')
      )

    defaults:
      run:
        working-directory: ${{ env.TF_STAGING_DIR }}

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Authenticate to GCP (OIDC)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.SERVICE_ACCOUNT_EMAIL }}

      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.GCS_BUCKET_NAME }}" \
            -backend-config="prefix=staging" \
            -reconfigure \
            -input=false \
            -no-color

      - name: Create terraform.tfvars
        run: |
          cat > terraform.tfvars <<EOF
          project_id    = "${{ vars.GCP_PROJECT_ID }}"
          cluster_name  = "${{ vars.GKE_CLUSTER_NAME }}"
          registry_name = "${{ vars.GAR_REPOSITORY_NAME }}"
          region        = "${{ vars.GCP_REGION }}"
          EOF

      # Download the EXACT plan binary produced by plan-phase-a.
      # We never re-plan here. This guarantees apply == reviewed plan.
      - name: Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan-phase-a
          path: ${{ env.TF_STAGING_DIR }}

      - name: Terraform Apply
        run: terraform apply -auto-approve -no-color tfplan.binary

  # =============================================================
  # JOB 5 — PLAN PHASE B  (ArgoCD bootstrap)
  # CRITICAL FIX: Depends on apply-phase-a (not just plan-phase-a)
  # because we need the GKE cluster to exist to plan GitOps bootstrap.
  # Only runs after infrastructure is deployed (never on PR).
  # =============================================================
  plan-phase-b:
    name: "Plan — Phase B (GitOps)"
    needs: [plan-phase-a, apply-phase-a]
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'

    defaults:
      run:
        working-directory: ${{ env.TF_BOOTSTRAP_DIR }}

    outputs:
      exitcode: ${{ steps.plan.outputs.exitcode }}

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Authenticate to GCP (OIDC)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.SERVICE_ACCOUNT_EMAIL }}

      - name: Verify cluster exists
        run: |
          gcloud container clusters describe \
            ${{ vars.GKE_CLUSTER_NAME }} \
            --region ${{ vars.GCP_REGION }}-b \
            --project ${{ vars.GCP_PROJECT_ID }}

      - name: Get GKE credentials
        run: |
          gcloud container clusters get-credentials \
            ${{ vars.GKE_CLUSTER_NAME }} \
            --region ${{ vars.GCP_REGION }}-b \
            --project ${{ vars.GCP_PROJECT_ID }}

      - name: Create terraform.tfvars
        run: |
          cat > terraform.tfvars <<EOF
          project_id             = "${{ vars.GCP_PROJECT_ID }}"
          region                 = "${{ vars.GCP_REGION }}"
          cluster_name           = "${{ vars.GKE_CLUSTER_NAME }}"
          gitops_repo_url        = "${{ vars.GITOPS_REPO_URL }}"
          gitops_target_revision = "main"
          gitops_path            = "${{ vars.GITOPS_PATH }}"
          EOF

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.GCS_BUCKET_NAME }}" \
            -backend-config="prefix=bootstrap" \
            -reconfigure \
            -input=false \
            -no-color

      - name: Terraform Plan
        id: plan
        shell: bash
        run: |
          set +e

          terraform plan \
            -no-color \
            -out=tfplan.binary \
            -detailed-exitcode \
            -input=false
          EXIT=$?
          echo "exitcode=${EXIT}" >> "$GITHUB_OUTPUT"

          echo "──────────────────────────────────────────────"
          case "${EXIT}" in
            0) echo "PLAN RESULT: No changes — bootstrap already applied." ;;
            1) echo "PLAN RESULT: Terraform error." ;;
            2) echo "PLAN RESULT: Changes detected — apply will run." ;;
          esac
          echo "──────────────────────────────────────────────"

          if [ "${EXIT}" -eq 1 ]; then exit 1; fi
          exit 0

      - name: Upload plan artifact
        if: steps.plan.outputs.exitcode == '2'
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-phase-b
          path: ${{ env.TF_BOOTSTRAP_DIR }}/tfplan.binary
          retention-days: 1

  # =============================================================
  # JOB 6 — APPLY PHASE B
  # =============================================================
  apply-phase-b:
    name: "Apply — Phase B (GitOps)"
    needs: [plan-phase-b, apply-phase-a]
    runs-on: ubuntu-latest
    if: |
      needs.plan-phase-b.outputs.exitcode == '2' &&
      github.event_name != 'pull_request' &&
      needs.apply-phase-a.result != 'failure'

    defaults:
      run:
        working-directory: ${{ env.TF_BOOTSTRAP_DIR }}

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Authenticate to GCP (OIDC)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.SERVICE_ACCOUNT_EMAIL }}

      - name: Get GKE credentials
        run: |
          gcloud container clusters get-credentials \
            ${{ vars.GKE_CLUSTER_NAME }} \
            --region ${{ vars.GCP_REGION }}-b \
            --project ${{ vars.GCP_PROJECT_ID }}

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.GCS_BUCKET_NAME }}" \
            -backend-config="prefix=bootstrap" \
            -reconfigure \
            -input=false \
            -no-color

      - name: Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan-phase-b
          path: ${{ env.TF_BOOTSTRAP_DIR }}

      - name: Terraform Apply
        run: terraform apply -auto-approve -no-color tfplan.binary

  # =============================================================
  # JOB 7 — DRIFT DETECTION  (scheduled + manual)
  # NEW JOB — runs on schedule (daily) and on workflow_dispatch.
  # Uses terraform plan -refresh-only to detect manual GCP changes
  # that happened outside Terraform (someone clicked in console).
  # Opens a GitHub issue automatically if drift is found.
  # =============================================================
  detect-drift:
    name: "Detect infrastructure drift"
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.action == 'plan')

    defaults:
      run:
        working-directory: ${{ env.TF_STAGING_DIR }}

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Authenticate to GCP (OIDC)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.SERVICE_ACCOUNT_EMAIL }}

      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Create terraform.tfvars
        run: |
          cat > terraform.tfvars <<EOF
          project_id    = "${{ vars.GCP_PROJECT_ID }}"
          cluster_name  = "${{ vars.GKE_CLUSTER_NAME }}"
          registry_name = "${{ vars.GAR_REPOSITORY_NAME }}"
          region        = "${{ vars.GCP_REGION }}"
          EOF

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.GCS_BUCKET_NAME }}" \
            -backend-config="prefix=staging" \
            -reconfigure \
            -input=false \
            -no-color

      # -refresh-only re-reads GCP state without changing anything.
      # Exit 2 = GCP reality differs from tfstate → drift detected.
      - name: Detect drift (refresh-only plan)
        id: drift
        shell: bash
        run: |
          set +e

          terraform plan \
            -refresh-only \
            -detailed-exitcode \
            -no-color \
            -out=drift.binary 2>&1 | tee drift.log

          EXIT=$?
          echo "drift_exitcode=${EXIT}" >> "$GITHUB_OUTPUT"

          echo "──────────────────────────────────────────────"
          case "${EXIT}" in
            0) echo "DRIFT CHECK: Infrastructure is in sync with tfstate." ;;
            1) echo "DRIFT CHECK: Error during refresh-only plan." ;;
            2) echo "DRIFT CHECK: DRIFT DETECTED — GCP differs from Terraform state." ;;
          esac
          echo "──────────────────────────────────────────────"

          if [ "${EXIT}" -eq 1 ]; then exit 1; fi
          exit 0

      # Open a GitHub issue automatically when drift is detected.
      # The SRE/DevOps team will be notified and can triage.
      - name: Open drift issue
        if: steps.drift.outputs.drift_exitcode == '2'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const log = fs.existsSync('${{ env.TF_STAGING_DIR }}/drift.log')
              ? fs.readFileSync('${{ env.TF_STAGING_DIR }}/drift.log', 'utf8').slice(0, 3000)
              : 'Log not available.';

            const title = `[Drift] GCP infrastructure differs from Terraform state — ${new Date().toISOString().slice(0,10)}`;

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'terraform-drift',
              state: 'open'
            });

            if (existing.data.length > 0) {
              console.log('Drift issue already open — skipping duplicate creation.');
              return;
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              labels: ['terraform-drift'],
              body: `## Infrastructure drift detected

            The scheduled drift check found that the live GCP infrastructure
            no longer matches the Terraform state file.

            **Next step:** run \`terraform plan\` locally and review the changes,
            then either apply them via the pipeline or import the manual changes.

            <details><summary>Drift log (truncated)</summary>

            \`\`\`
            ${log}
            \`\`\`
            </details>

            > Triggered by: scheduled run at ${new Date().toISOString()}
            > Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`
            });

  # =============================================================
  # JOB 8 — DESTROY  (manual, protected by environment approval)
  # Destroys in reverse dependency order: bootstrap → staging.
  # Requires a GitHub Environment named "staging-destroy" with
  # a required reviewer configured in repo settings.
  # =============================================================
  destroy:
    name: "Destroy staging"
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'destroy-staging'
    environment: staging-destroy

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Authenticate to GCP (OIDC)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.SERVICE_ACCOUNT_EMAIL }}

      - name: Get GKE credentials
        run: |
          gcloud container clusters get-credentials \
            ${{ vars.GKE_CLUSTER_NAME }} \
            --region ${{ vars.GCP_REGION }}-b \
            --project ${{ vars.GCP_PROJECT_ID }}

      # Destroy Phase B first — it depends on Phase A resources
      - name: Destroy Phase B (GitOps bootstrap)
        working-directory: ${{ env.TF_BOOTSTRAP_DIR }}
        run: |
          cat > terraform.tfvars <<EOF
          project_id             = "${{ vars.GCP_PROJECT_ID }}"
          region                 = "${{ vars.GCP_REGION }}"
          cluster_name           = "${{ vars.GKE_CLUSTER_NAME }}"
          gitops_repo_url        = "${{ vars.GITOPS_REPO_URL }}"
          gitops_target_revision = "main"
          gitops_path            = "apps/"
          EOF

          terraform init \
            -backend-config="bucket=${{ vars.GCS_BUCKET_NAME }}" \
            -backend-config="prefix=bootstrap" \
            -reconfigure -input=false -no-color

          # || true: bootstrap may already be gone if cluster was deleted manually
          terraform destroy -auto-approve -no-color || true

      # Destroy Phase A after Phase B is gone
      - name: Destroy Phase A (infrastructure)
        working-directory: ${{ env.TF_STAGING_DIR }}
        run: |
          cat > terraform.tfvars <<EOF
          project_id    = "${{ vars.GCP_PROJECT_ID }}"
          cluster_name  = "${{ vars.GKE_CLUSTER_NAME }}"
          registry_name = "${{ vars.GAR_REPOSITORY_NAME }}"
          region        = "${{ vars.GCP_REGION }}"
          EOF

          terraform init \
            -backend-config="bucket=${{ vars.GCS_BUCKET_NAME }}" \
            -backend-config="prefix=staging" \
            -reconfigure -input=false -no-color

          terraform destroy -auto-approve -no-color
