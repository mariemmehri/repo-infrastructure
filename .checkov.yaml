framework:
  - terraform

directory: .

# compact strips the evidence lines that make SARIF findings readable in Code Scanning.
compact: false
quiet: false

# Never pull remote modules during CI — supply-chain risk.
download-external-modules: false

# ── Severity gating ────────────────────────────────────────
# CRITICAL / HIGH  → hard fail  (pipeline blocked)
# MEDIUM / LOW     → soft fail  (reported, never blocks)
soft-fail-on:
  - MEDIUM
  - LOW
  - INFO
# ── Documented skips ───────────────────────────────────────
# Every skip MUST reference the audit item that will fix the
# underlying resource. Remove the skip when the fix is merged.
skip-check:
  - CKV_GCP_25   # TODO [C2] add logging_config   to modules/gke/main.tf
  - CKV_GCP_71   # TODO [C2] add monitoring_config to modules/gke/main.tf
  - CKV_GCP_64   # TODO [C4] enable private_cluster_config in modules/gke/main.tf
  - CKV_GCP_18   # TODO [H4] add secondary_ip_range blocks to modules/networking/main.tf
  - CKV2_GCP_18  # TODO [H8] add explicit google_compute_firewall to modules/networking/main.tf
  - CKV_GCP_8    # TODO [H7] enable node auto-repair in node pool
  - CKV_GCP_9    # TODO [H7] enable node auto-upgrade in node pool
  - CKV_GCP_41   # TODO [C3] sa-terraform-ci holds serviceAccountAdmin+projectIamAdmin — extract to manual bootstrap
  - CKV_GCP_49   # TODO [C3] sa-terraform-ci holds serviceAccountUser role at project level
  - CKV_GCP_84   # SKIP staging — CSEK on Artifact Registry not required; Google-managed encryption sufficient
  - CKV_GCP_65   # SKIP staging — RBAC with Google Groups requires Cloud Identity setup outside PFE scope
  - CKV_GCP_62   # SKIP — tfstate bucket logs to tfstate_logs; tfstate_logs itself cannot log without circular dependency
  - CKV_GCP_78   # SKIP — cnpg_backup bucket: barman-cloud manages its own backup retention; GCS versioning would fight Barman's own object lifecycle
